name: publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "if true, runs `npm publish --dry-run` instead of actually publishing"
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for npm provenance attestation
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck + tests
        run: bun run check
      - name: Build
        run: bun run build
      - name: Verify package metadata
        run: |
          test -f dist/cli.js
          test -f dist/index.js
          test -f dist/index.d.ts
          # confirm node-shebang on the cli entry
          head -1 dist/cli.js | grep -q '^#!/usr/bin/env node'
      - name: npm publish (dry run)
        if: inputs.dry_run == true
        run: npm publish --dry-run --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm publish
        if: inputs.dry_run != true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
